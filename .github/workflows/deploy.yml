name: Deploy to EC2 (Direct without Docker Hub)

# Jab bhi 'main' branch par push hoga, ye pipeline chalegi
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH into EC2 & Deploy
    runs-on: ubuntu-latest

    steps:
      # Step: Seedha EC2 me SSH karo aur commands run karo
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. EC2 me repo ke folder me jao
            cd ~/project- || cd ~/project\ 1 || cd ~/project-1 || cd ~/app || cd ~

            # 2. GitHub se latest code pull karo
            git pull origin main

            # 3. Docker container ko naye code ke sath build & restart karo
            docker compose up -d --build || sudo docker compose up -d --build

            # 4. Purani unused images delete karke disk space clean karo
            docker image prune -f || sudo docker image prune -f
